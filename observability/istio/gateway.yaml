apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: minimarket-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "minimarket-backend/minimarket.local"
        - "minimarket-pruebas/pruebas.minimarket.local"
