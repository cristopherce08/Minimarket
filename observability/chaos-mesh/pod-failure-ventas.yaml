# Deja fuera de servicio un pod de ventas-api-pruebas durante 60 s.
# Sirve para demostrar el circuit breaker (outlierDetection de la DestinationRule):
# Istio debe sacar de circulacion al pod que falla.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-failure-ventas
  namespace: minimarket-backend
spec:
  action: pod-failure
  mode: one
  duration: "60s"
  selector:
    namespaces:
      - minimarket-backend
    labelSelectors:
      app: ventas-api-pruebas
