apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay-ventas
  namespace: chaos-mesh
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - minimarket-backend
    labelSelectors:
      app: ventas-api
  delay:
    latency: "100ms"
    jitter: "20ms"
  duration: "2m"
