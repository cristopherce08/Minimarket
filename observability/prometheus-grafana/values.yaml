alertmanager:
  enabled: false
# En minikube estos componentes del plano de control solo escuchan en 127.0.0.1,
# por lo que Prometheus no puede leerlos y los targets quedan en DOWN.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
