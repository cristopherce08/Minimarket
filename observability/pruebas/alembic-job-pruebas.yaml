# Crea las tablas en la BD minimarket_pruebas (migraciones Alembic).
# Usa el label app=alembic-migration para que la NetworkPolicy de Postgres lo deje pasar.
apiVersion: batch/v1
kind: Job
metadata:
  name: alembic-migration-pruebas
  namespace: minimarket-backend
  labels:
    app: alembic-migration
    tier: backend
    entorno: pruebas
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: alembic-migration
        tier: backend
        entorno: pruebas
    spec:
      restartPolicy: OnFailure
      containers:
        - name: alembic-upgrade
          image: minimarket-ventas-api:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-db-pruebas-secret
                  key: DATABASE_URL
