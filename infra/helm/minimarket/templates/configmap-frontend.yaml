apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: {{ .Values.global.namespaces.frontend }}
  labels:
    {{- include "minimarket.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy hacia ventas-api en namespace minimarket-backend
        location /api/v1/productos {
            proxy_pass http://ventas-api.{{ .Values.global.namespaces.backend }}.svc.cluster.local:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/ventas {
            proxy_pass http://ventas-api.{{ .Values.global.namespaces.backend }}.svc.cluster.local:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/inventario {
            proxy_pass http://ventas-api.{{ .Values.global.namespaces.backend }}.svc.cluster.local:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health {
            proxy_pass http://ventas-api.{{ .Values.global.namespaces.backend }}.svc.cluster.local:8000;
            proxy_set_header Host $host;
        }

        # Proxy hacia reportes-api en namespace minimarket-backend
        location /api/v1/reportes {
            proxy_pass http://reportes-api.{{ .Values.global.namespaces.backend }}.svc.cluster.local:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
