{{- if and .Values.postgresql.enabled (empty .Values.postgresql.auth.existingSecret) .Values.postgresql.auth.password }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ .Values.global.namespaces.data }}
  labels:
    {{- include "minimarket.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
{{- end }}
{{- if and (empty .Values.backend.existingSecret) .Values.postgresql.auth.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-db-secret
  namespace: {{ .Values.global.namespaces.backend }}
  labels:
    {{- include "minimarket.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ .Values.postgresql.service.name }}.{{ .Values.global.namespaces.data }}.svc.cluster.local:{{ .Values.postgresql.service.port }}/{{ .Values.postgresql.auth.database }}"
{{- end }}
