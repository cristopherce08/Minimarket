# ==============================================================================
# MiniMarket Cloud — NetworkPolicy: Tráfico frontend y bloqueo a PostgreSQL
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-traffic
  namespace: minimarket-frontend
  labels:
    app.kubernetes.io/part-of: minimarket-cloud
spec:
  podSelector:
    matchLabels:
      tier: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Acepta conexiones HTTP en puerto 80 desde el exterior, Ingress o port-forward
    - ports:
        - protocol: TCP
          port: 80
  egress:
    # 1. Conexión hacia APIs del backend (ventas-api y reportes-api)
    - to:
        - namespaceSelector:
            matchLabels:
              name: minimarket-backend
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8001
    # 2. Resolución de nombres DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # NOTA DE SEGURIDAD:
    # No se incluye regla de salida hacia minimarket-data (puerto 5432).
    # Cualquier intento de conexión directa desde el frontend a la BD será bloqueado por Calico.
