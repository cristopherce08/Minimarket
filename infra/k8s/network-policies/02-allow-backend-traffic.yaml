apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-traffic
  namespace: minimarket-backend
  labels:
    app.kubernetes.io/part-of: minimarket-cloud
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [ventas-api, reportes-api]
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minimarket-frontend
          podSelector:
            matchLabels:
              app: frontend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
          podSelector:
            matchLabels:
              app: istio-ingressgateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [ventas-api, reportes-api]
      ports:
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 8001}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minimarket-data
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [ventas-api, reportes-api]
      ports:
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 8001}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
          podSelector:
            matchLabels:
              app: istiod
      ports:
        - {protocol: TCP, port: 15012}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-default-deny-ingress
  namespace: minimarket-backend
  labels:
    app.kubernetes.io/part-of: minimarket-cloud
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-spark-traffic
  namespace: minimarket-backend
  labels:
    app.kubernetes.io/part-of: minimarket-cloud
spec:
  podSelector:
    matchLabels:
      app: spark-job
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: spark-job
      ports:
        - {protocol: TCP, port: 7078}
        - {protocol: TCP, port: 7079}
