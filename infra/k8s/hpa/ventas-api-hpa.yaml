apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ventas-api-hpa
  namespace: minimarket-backend
  labels:
    app: ventas-api
    tier: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: minimarket-cloud
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ventas-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 25
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
      selectPolicy: Min
